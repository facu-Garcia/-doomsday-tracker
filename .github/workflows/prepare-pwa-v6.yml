name: Preparar iconos PWA V6
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prepare-pwa-v6.yml
permissions:
  contents: write
jobs:
  copy-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versionar iconos previamente extraidos del poster promocional
        run: |
          cp icon-192.png app-icon-v6-192.png
          cp icon-512.png app-icon-v6-512.png
          cp icon-maskable-512.png app-icon-v6-maskable-512.png
      - name: Publicar iconos versionados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-icon-v6-192.png app-icon-v6-512.png app-icon-v6-maskable-512.png
          if ! git diff --cached --quiet; then
            git commit -m "pwa: versioned Doom icons for Android refresh [skip ci]"
            git push
          fi
